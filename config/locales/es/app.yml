es:
  app_name: "Bookly"
  # Each language is named in itself, so both files hold the same values.
  locale_names:
    es: "Español"
    en: "English"
  formatting:
    duration:
      hours: "%{count} h"
      minutes: "%{count} min"
  number:
    currency:
      format:
        # rails-i18n uses "12.000 $"; Argentina writes "$ 12.000".
        format: "%u %n"
  # Added to rails-i18n's formats: l(date, format: :weekday), l(time, format: :hour),
  # l(time, format: :weekday_hour).
  date:
    formats:
      weekday: "%a %-d %b"
  time:
    formats:
      hour: "%H:%M"
      weekday_hour: "%a %-d %b, %H:%M"
