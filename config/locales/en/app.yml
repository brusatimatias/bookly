en:
  app_name: "Bookly"
  # Each language is named in itself, so both files hold the same values.
  locale_names:
    es: "Español"
    en: "English"
  formatting:
    duration:
      hours: "%{count} h"
      minutes: "%{count} min"
  number:
    currency:
      format:
        format: "%u%n"
  # Added to rails-i18n's formats: l(date, format: :weekday), l(time, format: :hour).
  date:
    formats:
      weekday: "%a, %b %-d"
  time:
    formats:
      hour: "%-I:%M %p"
